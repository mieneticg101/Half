[workspace]
resolver = "2"
members = [
    "half-core",
    "half-macros",
    "half-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Half Framework Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mieneticg101/Half"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime - Latest stable versions
tokio = { version = "1.42", features = ["full"] }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Security - Latest versions for better security
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
htmlescape = "0.3"
rand = "0.9"  # Updated to latest

# Utilities
bytes = "1.10"  # Updated to latest
futures = "0.3"
pin-project = "1.1"
thiserror = "2.0"
percent-encoding = "2.3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Macros
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
