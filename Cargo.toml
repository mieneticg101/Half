[workspace]
resolver = "2"
members = [
    "half-core",
    "half-macros",
    "half-cli",
]

[workspace.package]
version = "0.13.0"
edition = "2024"
authors = ["Half Framework Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mieneticg101/Half"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime - Latest stable versions
tokio = { version = "1.42", features = ["full"] }
hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Security - Latest versions for better security
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
htmlescape = "0.3"
rand = "0.9"  # Updated to latest
dashmap = "6.1"  # Thread-safe HashMap for nonce storage

# TLS - Pure Rust TLS 1.3 implementation
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"

# Utilities
bytes = "1.10"  # Updated to latest
futures = "0.3"
pin-project = "1.1"
thiserror = "2.0"
percent-encoding = "2.3"
chrono = "0.4"  # Time management for nonce expiration

# Compression - High performance async compression
async-compression = { version = "0.4", features = ["tokio", "brotli", "gzip", "zstd"] }
flate2 = "1.0"  # Fallback compression

# Rate Limiting
governor = "0.7"
parking_lot = "0.12"  # High-performance synchronization primitives

# WebSocket & SSE (Phase 2)
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Caching (Phase 2)
moka = { version = "0.12", features = ["future"] }  # High-performance concurrent cache with TTL

# Logging & Tracing (Phase 4)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.11", features = ["v4", "fast-rng"] }

# Authentication (Phase 4)
jsonwebtoken = "9.3"

# File Upload (Phase 4)
multer = "3.1"

# Static Files & Templates (Phase 5)
handlebars = "6.2"
mime_guess = "2.0"
tokio-util = { version = "0.7", features = ["io"] }
urlencoding = "2.1"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Macros
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
proc-macro2 = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
